name: engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.compiler }} ${{ matrix.sanitize || 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            build_type: RelWithDebInfo
          - compiler: clang++
            build_type: RelWithDebInfo
          - compiler: clang++
            build_type: Debug
            sanitize: address,undefined
          - compiler: clang++
            build_type: RelWithDebInfo
            sanitize: thread
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S engine -B engine/build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTICKER_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build engine/build -j
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir engine/build --output-on-failure -j --timeout 120

  fuzz:
    name: differential fuzz (long)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build engine/build -j
      - name: 1M commands per seed
        env:
          TICKER_FUZZ_COMMANDS: "1000000"
        run: engine/build/engine_tests --gtest_filter='Differential*'

  bench:
    name: benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DTICKER_BUILD_TESTS=OFF
      - run: cmake --build engine/build -j
      - name: Latency
        run: engine/build/latency | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Throughput
        run: engine/build/book_bench --benchmark_min_time=0.2s
